name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays 06:17 UTC, a day off the frontend audit so the two don't collide.
    # New advisories land against unchanged pins, so the audit needs a trigger
    # that doesn't depend on someone opening a PR.
    - cron: "17 6 * * 2"

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # setuptools is upgraded alongside pip because pip-audit audits the whole
      # environment, including the build tooling setup-python ships.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit

      # Audits the installed environment rather than `-r requirements.txt` so
      # transitively-pinned packages are checked exactly as they land in the
      # image. `--strict` fails on resolution errors instead of skipping a
      # package silently.
      #
      # When a finding can't be fixed yet, add an `--ignore-vuln` line with a
      # comment saying why — don't drop the gate. Its value is catching the
      # *next* advisory, and that only works while the job is green.
      #
      # The starlette entries below are transitively pinned by
      # `fastapi==0.109.2` (which requires `starlette>=0.36.3,<0.37.0`), so
      # clearing them means upgrading FastAPI, Starlette and Pydantic together
      # — tracked as follow-up work, deliberately not bundled into a
      # dependency-security patch.
      - name: pip-audit
        run: |
          pip-audit --strict --progress-spinner=off \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy app/
