name: Docker Build

on:
  push:
    branches: [main]
  # Every pull request, whatever its base (stacked PRs included).
  pull_request:

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t milestone-planner:ci .
