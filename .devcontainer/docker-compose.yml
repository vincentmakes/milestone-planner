services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=milestone
      - DB_USER=milestone
      - DB_PASSWORD=milestone_dev
      - SESSION_SECRET=dev-session-secret-change-in-production
      - MULTI_TENANT=true
      - MASTER_DB_HOST=db
      - MASTER_DB_PORT=5432
      - MASTER_DB_NAME=milestone_admin
      - MASTER_DB_USER=postgres
      - MASTER_DB_PASSWORD=postgres_dev
      - PG_ADMIN_USER=postgres
      - PG_ADMIN_PASSWORD=postgres_dev
      - TENANT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AUTO_INIT_DB=true
      - INIT_ADMIN_EMAIL=admin@demo.local
      - INIT_ADMIN_PASSWORD=demo1234
      - DEBUG=true
      - PORT=8485
    ports:
      - "8485:8485"
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
