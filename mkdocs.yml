site_name: Milestone Planner Documentation
site_url: https://docs-milestone.verdet.me
site_description: User and administration documentation for Milestone Planner — R&D project management with Gantt charts, staff allocation, and equipment booking.
repo_url: https://github.com/vincentmakes/milestone-planner
repo_name: vincentmakes/milestone-planner

theme:
  name: material
  # Template overrides (docs/overrides/partials/palette.html: the print and
  # PDF buttons of the header); kept out of the pages by exclude_docs.
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.svg

# Build-time helpers inside docs/ that are not pages: the version hook, the
# print page's templates and the theme overrides.
exclude_docs: |
  hooks/
  overrides/
  print-templates/

# Reads /VERSION into config.extra.version (the print page's cover).
hooks:
  - docs/hooks/manual_version.py

plugins:
  - search
  # One page with the User Guide and the Admin Guide, to print or save as PDF
  # (/print_page/); scripts/docs/export_manual_pdf.py prints it to the PDF that
  # .github/workflows/manual-pdf.yml publishes. Must stay the last plugin.
  - print-site:
      add_to_navigation: false
      print_page_title: "User and Admin Manual"
      add_cover_page: true
      cover_page_template: docs/print-templates/cover_page.tpl
      add_print_site_banner: true
      print_site_banner_template: docs/print-templates/banner.tpl
      add_table_of_contents: true
      toc_title: "Contents"
      toc_depth: 2
      # Off: the plugin numbers the excluded Home page and sections too (the
      # User Guide would start at 2).
      enumerate_headings: false
      enumerate_figures: false
      exclude:
        - index.md
        - developer-guide/
        - release-notes.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  anchors: warn

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

extra:
  # The ready-made PDF the header's download button and the print page's
  # banner link to (.github/workflows/manual-pdf.yml publishes it). A
  # self-hosted copy can point it elsewhere; empty hides the button.
  manual_pdf_url: https://github.com/vincentmakes/milestone-planner/releases/download/manual-latest/Milestone-Manual.pdf
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vincentmakes/milestone-planner

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user-guide/getting-started.md
    - Gantt Charts: user-guide/gantt-charts.md
    - Kanban Board: user-guide/kanban-board.md
    - My Work: user-guide/my-work.md
    - Dashboards: user-guide/dashboards.md
    - Staff Management: user-guide/staff-management.md
    - Equipment Booking: user-guide/equipment-booking.md
    - Cross-Site View: user-guide/cross-site-view.md
    - Vacations & Time Off: user-guide/vacations.md
    - Import & Export: user-guide/import-export.md
    - What-If Planning: user-guide/what-if-planning.md
    - Settings & Configuration: user-guide/settings.md
    - Real-Time Collaboration: user-guide/collaboration.md
    - Keyboard Shortcuts: user-guide/keyboard-shortcuts.md
  - Admin Guide:
    - Overview: admin-guide/overview.md
    - Installation: admin-guide/installation.md
    - Multi-Tenant Management: admin-guide/multi-tenant.md
    - Organization & SSO: admin-guide/organizations-sso.md
    - Audit Log: admin-guide/audit-log.md
    - Database & Migrations: admin-guide/database.md
    - Backup & Recovery: admin-guide/backup-recovery.md
    - Monitoring & Troubleshooting: admin-guide/monitoring.md
    - Hosting the Documentation: admin-guide/hosting-the-documentation.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Local Development: developer-guide/local-development.md
    - API Reference: developer-guide/api-reference.md
    - Codebase Reference:
      - Codebase Map: developer-guide/codebase-map.md
      - Database Schema: developer-guide/database-schema.md
      - Route Auth Gates & Side Effects: developer-guide/routes.md
      - Authentication & Tenancy: developer-guide/auth-and-tenancy.md
      - Real-Time Internals: developer-guide/realtime.md
      - Frontend Architecture: developer-guide/frontend-architecture.md
      - Conventions in Depth: developer-guide/conventions-in-depth.md
      - Working with AI Agents: developer-guide/ai-workflow.md
    - Contributing: developer-guide/contributing.md
    - Release Notes: release-notes.md
